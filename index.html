<!-- YouTube Live Subscriber Fetch Script -->
    <script>
        async function fetchLiveYtSubscribers() {
            const apiKey = 'AIzaSyD-cBKcBB2jraBKUPJb1TBQpilYfIg48ek';[cite: 11]
            const channelHandle = 'slpasiya'; 
            
            const url = `https://www.googleapis.com/youtube/v3/channels?part=statistics&forHandle=${channelHandle}&key=${apiKey}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.items && data.items.length > 0) {
                    const count = data.items[0].statistics.subscriberCount;
                    // කිසිම කෙටි කිරීමකින් තොරව හරියටම එම අංකයම පෙන්වයි (උදා: 93458)
                    document.getElementById('yt-live-subs').innerText = count;
                } else {
                    document.getElementById('yt-live-subs').innerText = 'Unavailable';
                }
            } catch (error) {
                console.error('YouTube Live Counter Error:', error);
                document.getElementById('yt-live-subs').innerText = 'Error';
            }
        }

        fetchLiveYtSubscribers();
        setInterval(fetchLiveYtSubscribers, 120000);
    </script>
