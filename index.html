<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SL PASIYA - Official Website</title>
    <style>
        /* මූලික Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            line-height: 1.6;
        }

        /* Navigation Bar Header */
        header {
            background-color: #1f1f1f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-container img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        .logo-container h1 {
            font-size: 20px;
            color: #ff3e3e;
            letter-spacing: 1px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav ul li a {
            color: #dddddd;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        nav ul li a:hover, nav ul li a.active {
            color: #ffffff;
            background-color: #ff3e3e;
        }

        /* Hero Section */
        .hero {
            position: relative;
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('Main.jpeg') center/cover no-repeat;
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero h2 {
            font-size: 42px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .hero p {
            font-size: 18px;
            max-width: 600px;
            color: #cccccc;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background-color: #ff3e3e;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #cc0000;
        }

        /* Responsive Layout for Mobile */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: 15px;
                gap: 15px;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
            }

            .hero h2 {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

    <!-- Header & Navigation Bar -->
    <header>
        <div class="logo-container">
            <img src="logo.jpg" alt="SL PASIYA Logo">
            <h1>SL PASIYA</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="rentals.html">Rentals</a></li>
                <li><a href="reviews.html">Reviews</a></li>
                <li><a href="visuals.html">Visuals</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Banner / Hero Section -->
    <section class="hero">
        <h2>Welcome to SL PASIYA</h2>
        <p>Automotive Reviews, Motorsport Videography & Equipment Rentals</p>
        <a href="visuals.html" class="btn">Explore Work</a>
    </section>

</body>
</html>
